name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The plan's OSS-0.5: both platforms people actually run agents on, both supported
  # Node lines. A shim that works on Ubuntu and not macOS is the bug this catches.
  #
  # 20 is not one of them any more: pnpm 11.5 needs Node 22.13, so the matrix leg
  # that claimed to prove Node 20 support crashed before it installed anything.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run deadcode

  # Catches a broken manifest at PR time rather than at tag time.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm -r publish --dry-run --no-git-checks
