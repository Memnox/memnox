name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land after a commit does, so re-scan unchanged code weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Code scanning is free on a public repository and needs paid Advanced
    # Security on a private one. The analysis itself runs fine either way — it is
    # the upload that is refused — so skip rather than fail a scan nobody can
    # read, and pick it back up on its own if this repository ever goes public.
    #
    # Compared as a string on purpose: GitHub coerces both false and null to 0,
    # so `== false` also matches an event whose payload carries no repository,
    # and the job would come back to fail on the weekly schedule.
    if: format('{0}', github.event.repository.private) == 'false'
    permissions:
      contents: read
      security-events: write
      # analyze reads its own run to attach results; without this a private repo
      # fails at the last step with "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # High and above fails the build; anything lower is reported, not blocking.
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  self-scan:
    name: Memnox content shield
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # We ship a secret scanner; not running it on our own diff is indefensible.
      - name: Scan the pull request diff
        if: github.event_name == 'pull_request'
        run: node packages/cli/dist/index.js ci --base "origin/${{ github.base_ref }}"

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container:
    name: Container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t memnox-runtime:scan .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: memnox-runtime:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
