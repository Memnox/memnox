name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance signs against this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/core/package.json').version")"
          test "$tag" = "$pkg" || {
            echo "tag $tag does not match package version $pkg"
            exit 1
          }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Dependency order, not the alphabetical order --workspaces uses. npm does
      # not resolve dependencies at publish time, so the wrong order still
      # succeeds — it just leaves a window where `npm i -g memnox` resolves a CLI
      # whose ten @memnox/* dependencies are not on the registry yet.
      - name: Publish in dependency order
        run: |
          for pkg in @memnox/core @memnox/content-shield @memnox/policy-engine \
                     @memnox/redis @memnox/code-graph @memnox/intelligence \
                     @memnox/local-gate @memnox/memory @memnox/risk @memnox/sdk \
                     @memnox/mcp-firewall @memnox/postgres @memnox/runtime \
                     @memnox/trust-bench memnox; do
            echo "publishing $pkg"
            npm publish -w "$pkg" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
