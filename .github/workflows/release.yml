name: Release

# Releasing is a decision, and a tag is how somebody makes it.
#
# This ran on every push to main, which was safe only while a changeset was always
# pending: the action opens a version PR when it finds one and publishes when it does
# not. With none pending, merging anything to main published it — and because this
# workflow and `ci.yml` are independent, it would have published without waiting to
# see whether the tests passed.
on:
  push:
    tags: ['v*']

# `id-token` is what signs the provenance attestation; `contents` is only read here,
# because a tag build publishes what the tag points at and writes nothing back.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The action exists to open version PRs from changesets, which a tag build is
      # past. `changeset publish` is the half that matters here: it skips anything
      # already on the registry and publishes the rest in dependency order, so
      # `@memnox/core` lands before the CLI that requires it.
      - run: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
