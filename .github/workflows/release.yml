name: Release

# Releasing is a decision, and a tag is how somebody makes it.
#
# This ran on every push to main, which was safe only while a changeset was always
# pending: the action opens a version PR when it finds one and publishes when it does
# not. With none pending, merging anything to main published it — and because this
# workflow and `ci.yml` are independent, it would have published without waiting to
# see whether the tests passed.
on:
  push:
    tags: ['v*']

# `id-token` is what signs the provenance attestation; `contents` is only read here,
# because a tag build publishes what the tag points at and writes nothing back.
permissions:
  contents: read
  id-token: write

jobs:
  # The Noise addon is native, so each platform builds its own on its own runner and the
  # release job publishes each one inside the package npm installs on that platform only.
  noise:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-13
          - target: linux-x64-gnu
            runner: ubuntu-22.04
          - target: linux-arm64-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh native/noise/scripts/build-node.sh
      - run: cp native/noise/memnox-noise.*.node "memnox-noise.${{ matrix.target }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: noise-${{ matrix.target }}
          path: memnox-noise.${{ matrix.target }}.node
          if-no-files-found: error

  release:
    needs: noise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: noise-*
          path: noise-builds
      # Each build goes into the package named for its platform, which is all that package ships.
      - run: |
          for dir in noise-builds/noise-*; do
            target="${dir#noise-builds/noise-}"
            cp "$dir/memnox-noise.$target.node" "native/noise/npm/$target/"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # This job does not wait for `ci.yml`, so it proves the tag itself before anything reaches npm.
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      # The action exists to open version PRs from changesets, which a tag build is
      # past. `changeset publish` is the half that matters here: it skips anything
      # already on the registry and publishes the rest in dependency order, so
      # `@memnox/core` lands before the CLI that requires it.
      - run: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
