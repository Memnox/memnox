name: Labels

# Ported from EddieHubCommunity/support. Their gh-action-open-source-labels is archived
# and floats on @main, so the label set is vendored here and applied with `gh`.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two concurrent imports would race on the same label names.
concurrency:
  group: labels

jobs:
  import:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/labels.json
          sparse-checkout-cone-mode: false

      # Import only: a label that is already there is left exactly as it is.
      #
      # This used a third party importer that claimed the same thing and did not do
      # it: the first existing label came back 422 `already_exists` and failed the
      # run, so the workflow went red on every push once the labels existed. `gh` is
      # on the runner, creates one label per call, and lets each one say "already"
      # without taking the rest down with it.
      - name: Import open source standard labels
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r '.name' <<<"$label")
            color=$(jq -r '.color' <<<"$label")
            if gh label create "$name" --color "$color" 2>/dev/null; then
              echo "created  $name"
            else
              echo "already  $name"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
