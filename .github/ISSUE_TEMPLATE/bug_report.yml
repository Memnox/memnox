name: Bug report
description: Something Memnox did that it should not have, or did not do that it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before anything else: **do not paste a path, a credential name, or the
        contents of a policy file that names one.** `memnox doctor` output is safe to
        share only after you have read it.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what it did instead of what you expected.
      placeholder: |
        I ran: memnox protect --apply
        I expected: ...
        It did: ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: memnox doctor
      description: >
        Paste the output of `memnox doctor`. It names findings and agents, never
        secret values — but read it before pasting.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `memnox --version`.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: The agent you were running, the rule involved, whatever helps.
