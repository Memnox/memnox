name: Feature request
description: Something Memnox should be able to answer and cannot
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: >
        What is happening in your week that Memnox does not help with? Describe the
        problem rather than the feature — the feature is usually not the interesting part.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: How you handle it now, and why that is not good enough.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you imagine
      description: A command, a flag, an output — however rough.
