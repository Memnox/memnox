[package]
name = "memnox"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Runtime authorization client for the Memnox governance runtime"
repository = "https://github.com/memnox/memnox-runtime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", optional = true }

[features]
default = ["http"]
http = ["dep:ureq"]
