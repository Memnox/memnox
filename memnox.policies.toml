version = 1

[[policies]]
name = "filesystem-deny"
description = "Reading your credentials — ~/.ssh, ~/.aws, .env files"

[policies.match]
actions = [ "filesystem.read" ]
targets = [ "**/.ssh", "**/.ssh/**", "**/.aws", "**/.aws/**", "**/.gcloud", "**/.gcloud/**", "**/.kube", "**/.kube/**", "**/.env", "**/.env.*" ]

[policies.decision]
effect = "deny"
reason = "you chose to deny this: almost no task needs the key itself, and a leaked one is somebody’s weekend"

[policies.decision.alternative]
action = "filesystem.read"
note = "Ask somebody, or change this rule if it is wrong for your work."

[[policies]]
name = "shell-ask"
description = "Destructive shell commands — rm -rf, dd, truncate"

[policies.match]
actions = [ "filesystem.delete" ]

[policies.decision]
effect = "ask"
reason = "you chose to be asked about this: sometimes it really is the build directory, so a person should look"

[policies.decision.alternative]
action = "filesystem.delete"
note = "Ask somebody, or change this rule if it is wrong for your work."

[[policies]]
name = "git-deny"
description = "Force-pushing, and hard resets"

[policies.match]
actions = [ "git.push", "git.reset", "git.clean" ]

[policies.decision]
effect = "deny"
reason = "you chose to deny this: it rewrites history somebody else may already have pulled"

[policies.decision.alternative]
action = "git.push"
note = "Ask somebody, or change this rule if it is wrong for your work."

[[policies]]
name = "mcp-ask"
description = "MCP tools that change something outside this machine"

[policies.match]
actions = [ "mcp.*" ]

[policies.decision]
effect = "ask"
reason = "you chose to be asked about this: these are the calls whose consequences other people see"

[policies.decision.alternative]
action = "mcp.*"
note = "Ask somebody, or change this rule if it is wrong for your work."

[[policies]]
name = "network-ask"
description = "Requests to hosts no rule names"

[policies.match]
actions = [ "http.request" ]

[policies.decision]
effect = "ask"
reason = "you chose to be asked about this: denying every unknown host breaks ordinary work on the first package install"

[policies.decision.alternative]
action = "http.request"
note = "Ask somebody, or change this rule if it is wrong for your work."
