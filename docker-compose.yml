services:
  memnox-runtime:
    build: .
    ports:
      - "7466:7466"
    volumes:
      # Files are the only backing store: one process, one machine, one audit chain.
      - memnox-data:/data
    environment:
      # The container binds 0.0.0.0, so the runtime refuses to start without this.
      - MEMNOX_ADMIN_TOKEN=${MEMNOX_ADMIN_TOKEN:?set MEMNOX_ADMIN_TOKEN — the management API is exposed on 0.0.0.0}
    restart: unless-stopped

volumes:
  memnox-data:
