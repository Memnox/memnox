services:
  memnox-runtime:
    build: .
    ports:
      - "7466:7466"
    volumes:
      - memnox-data:/data
      # Read-only: the runtime never writes the keyring, only reads it.
      - ${MEMNOX_KEYRING_FILE:?set MEMNOX_KEYRING_FILE — run "memnox keys generate --keyring-file memnox-keyring.json"}:/run/secrets/keyring.json:ro
    environment:
      # The container binds 0.0.0.0, so the runtime refuses to start without this.
      - MEMNOX_ADMIN_TOKEN=${MEMNOX_ADMIN_TOKEN:?set MEMNOX_ADMIN_TOKEN — the management API is exposed on 0.0.0.0}
      - MEMNOX_KEYRING_FILE=/run/secrets/keyring.json
      - MEMNOX_ENCRYPTION_MODE=${MEMNOX_ENCRYPTION_MODE:-permissive}
      # Uncomment for shared Postgres storage (required when scaling to multiple instances).
      # - MEMNOX_DATABASE_URL=postgres://memnox:memnox@postgres:5432/memnox
    restart: unless-stopped
    # depends_on: [postgres]

  # Uncomment to run the bundled Postgres for multi-instance deployments.
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     - POSTGRES_USER=memnox
  #     - POSTGRES_PASSWORD=memnox
  #     - POSTGRES_DB=memnox
  #   volumes:
  #     - memnox-postgres:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  memnox-data:
  # memnox-postgres:

  # Memnox plus Graphify in one image — no host Python, nothing to reconcile.
